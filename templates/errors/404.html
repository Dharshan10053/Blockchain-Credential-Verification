{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="container page-wrap">
  <div class="error-page fade-up">
    <div class="error-code">404</div>
    <div class="error-icon">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/>
        <path d="M21 21l-4.35-4.35" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Page Not Found</h1>
    <p>The page or certificate you're looking for doesn't exist. It may have been moved, or the link may be incorrect.</p>
    <div class="error-actions">
      <a href="{{ url_for('home') }}" class="btn btn-primary">Go Home</a>
      <a href="{{ url_for('verify') }}" class="btn btn-secondary">Verify Certificate</a>
      <a href="{{ url_for('issue') }}" class="btn btn-ghost">Issue Certificate</a>
    </div>
  </div>
</div>
{% endblock %}
