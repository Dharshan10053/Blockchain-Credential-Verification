<!DOCTYPE html>
<html>
<head>
    <title>Auto Issue Certificate</title>
</head>
<body>
    <h2>Upload Certificate to Issue</h2>
    <form method="POST" enctype="multipart/form-data">
        <label>Certificate File:</label>
        <input type="file" name="certificate" required><br><br>
        <input type="submit" value="Issue Certificate">
    </form>
</body>
</html>
