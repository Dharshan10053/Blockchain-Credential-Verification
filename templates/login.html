{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container page-wrap">
  <div class="form-card fade-up">
    <h2>Secure Login</h2>
    
    {% if error %}
      <div class="alert alert-error" style="color: #ff6b6b; background: rgba(255,107,107,0.1); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text-mid);">Username</label>
        <input type="text" id="username" name="username" class="form-control" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff;">
      </div>
      
      <div class="form-group" style="margin-bottom: 2rem;">
        <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-mid);">Password</label>
        <input type="password" id="password" name="password" class="form-control" required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #fff;">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
        Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
